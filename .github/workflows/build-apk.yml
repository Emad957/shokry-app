name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flet flet-cli yt-dlp

      - name: Build APK
        run: flet build apk \
          --project-name "برنامج شكري" \
          --project-description "تطبيق تحميل فيديوهات" \
          --project-version "1.0.0" \
          --add-assets assets

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: build/apk/*.apk