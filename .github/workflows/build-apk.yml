name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install flet flet-cli yt-dlp "binaryornot<0.5"

      - name: Build APK
        run: flet build apk --yes --module-name main -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: build/apk/*.apk